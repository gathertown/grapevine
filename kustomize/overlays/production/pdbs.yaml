    matchLabels:
      app.kubernetes.io/name: ingest-gatekeeper
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: steward
  namespace: grapevine-services
  labels:
    app.kubernetes.io/name: steward
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: steward
---
