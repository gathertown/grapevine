apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: grapevine-api
  namespace: grapevine-services
  labels:
    app.kubernetes.io/name: grapevine-api
spec:
  minAvailable: 60%
  selector:
    matchLabels:
      app.kubernetes.io/name: grapevine-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: grapevine-app
  namespace: grapevine-services
  labels:
    app.kubernetes.io/name: grapevine-app
spec:
  minAvailable: 60%
  selector:
    matchLabels:
      app.kubernetes.io/name: grapevine-app
---
apiVersion: policy/v1
